# The official check on clean GitHub machines (Linux x86_64):
#   check   - make check on Python 3.11 (the official image), 3.12 and 3.13; mypy on 3.11
#   docker  - the container as the jury runs it (no network, 2 CPUs, 4 GB), then hardened:
#             read-only root filesystem, a non-root user, no capabilities, no privilege gain;
#             outputs go to /tmp; then each baseline policy in its own container
#             (make docker-isolated: the env on the runner, the policy in Dockerfile.policy)
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test dependencies (pinned)
        run: python -m pip install -r requirements-dev.txt
      - name: make check
        shell: bash
        run: python -m auditenv.run check --with-tests 2>&1 | tee check-${{ matrix.python }}.log
      - name: Static types (mypy, 3.11 only)
        if: matrix.python == '3.11'
        run: python -m pip install mypy==2.3.1 && python -m mypy
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-${{ matrix.python }}
          path: check-${{ matrix.python }}.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        shell: bash
        run: docker build -t genesis-audit-env:ci .
      - name: Official run (no network, 2 CPU, 4 GB)
        shell: bash   # bash -eo pipefail: a failing check fails the job even through tee
        run: docker run --rm --network none --cpus 2 --memory 4g genesis-audit-env:ci 2>&1 | tee docker-check.log
      - name: Hardened run (read-only filesystem, non-root user, no capabilities)
        shell: bash
        run: |
          docker run --rm --network none --cpus 2 --memory 4g \
            --read-only --tmpfs /tmp:rw,size=1g --user 10001:10001 -e HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            genesis-audit-env:ci 2>&1 | tee docker-check-hardened.log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Each policy in its own container (make docker-isolated)
        shell: bash
        run: make docker-isolated PY=python POLICY_IMAGE=genesis-audit-policy:ci 2>&1 | tee docker-check-isolated.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-check*.log
